name: FaceLit Frontend CI

on:
  pull_request:
  push:
    branches: [dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      # One existing frontend test imports NotificationCatalog.java as an external fixture.
      - name: Checkout backend test fixture
        uses: actions/checkout@v4
        with:
          repository: FaceLit-2026/backend
          ref: 8dc82435d2276c1043964d45ff6bcf07ddb635f4
          path: backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend scripts and component tests with coverage
        working-directory: frontend
        env:
          NODE_V8_COVERAGE: coverage-v8
        run: npm test

      - name: Check TypeScript
        working-directory: frontend
        run: npx --no-install tsc --noEmit

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Build web application
        working-directory: frontend
        run: npx --no-install expo export --platform web --output-dir .expo/ci-web

      - name: Upload frontend coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-coverage
          path: |
            frontend/coverage-v8/
            frontend/coverage/
          if-no-files-found: warn
